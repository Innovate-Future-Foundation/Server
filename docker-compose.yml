services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: inff-api-build

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '5091:5091'
    environment:
      - DBConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};
      - JWTConfig__SecretKey=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=${DEP_ENV}
      - ASPNETCORE_URLS=http://+:5091/
    depends_on:
      - migration
    networks:
      - app-network

  migration:
    image: inff-api-build
    command: >
      sh -c "dotnet ef database update
      --project InnovateFuture.Infrastructure/InnovateFuture.Infrastructure.csproj
      --startup-project InnovateFuture.Api/InnovateFuture.Api.csproj"
    environment:
      - DBConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};
      - JWTConfig__SecretKey=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=${DEP_ENV}
    depends_on:
      - base
      - postgres
    networks:
      - app-network

  postgres:
    container_name: container-postgres
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # - postgres-data:/var/lib/postgresql/data
      - ./db/data/postgres:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  pgadmin:
    container_name: container-pgadmin
    build:
      context: .
      dockerfile: Dockerfile.pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASS}
    volumes:
      # - pgadmin-data:/var/lib/pgadmin
      - ./db/data/postgres:/var/lib/postgresql/data 
    restart: unless-stopped
    networks:
      - app-network

# volumes:
#   postgres-data:
#   pgadmin-data:

networks:
  app-network:
    driver: bridge