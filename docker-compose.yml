services:
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: inff-api-build
    
  rmq:
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # RabbitMQ main service
      - "15672:15672" # RabbitMQ management UI
    networks:
      - app-network  # Attach to the same network
    healthcheck: # Add health check
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '5091:5091'
    environment:
      - DBConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};
      - RabbitmqHost=${RABBITMQ_HOST}
      - JWTConfig__SecretKey=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=${DEP_ENV}
      - ASPNETCORE_URLS=http://+:5091/
    depends_on:
      rmq:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      test:
        condition: service_completed_successfully
    networks:
      - app-network

  test:
    image: inff-api-build
    command: >
      sh -c "dotnet test
      --configuration Release
      --no-build --verbosity normal"
    depends_on:
      base:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully

  migration:
    image: inff-api-build
    command: >
      sh -c "dotnet ef database update
      --project src/InnovateFuture.Infrastructure/InnovateFuture.Infrastructure.csproj
      --startup-project src/InnovateFuture.Api/InnovateFuture.Api.csproj
      --configuration Release
      --no-build"
    environment:
      - DBConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS};
      - JWTConfig__SecretKey=${JWT_SECRET}
      - ASPNETCORE_ENVIRONMENT=${DEP_ENV}
    depends_on:
      - base
      - postgres
    networks:
      - app-network

  postgres:
    container_name: container-postgres
    image: postgres:17.2
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  pgadmin:
    container_name: container-pgadmin
    build:
      context: .
      dockerfile: Dockerfile.pgadmin
    depends_on:
      - postgres
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_USER}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASS}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge