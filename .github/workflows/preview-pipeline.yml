name: PR Preview - Deployment
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: The Pull Request number
        required: true
        type: number
  pull_request:
    branches:
      - dev
    paths: 
      - .github/workflows/preview-pipeline.yml
      - src/**
      - Dockerfile*

permissions:
  id-token: write # This is required for requesting the JWT (OIDC)
  contents: read
  pull-requests: write

jobs:
  conduct_tag:
    runs-on: ubuntu-22.04
    steps:
      - id: checkout_latest
        name: Checkout latest
        uses: actions/checkout@v4

      - id: create_tag
        if: inputs.image_tag == ''
        name: Extract PR Info
        run:
          short_hash=$(git rev-parse --short HEAD)
          echo "tag=$short_hash_${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

    outputs:
      image_tag: ${{ inputs.image_tag || steps.create_tag.outputs.tag }}

  build-and-push:
    uses: ./.github/workflows/build-and-push.yml
    needs: conduct_tag
    with:
      environment: Development
      image_tag: ${{ needs.conduct_tag.outputs.image_tag }}
    secrets:
      ECR_REGION: ${{ secrets.CENTRAL_ECR_REGION }}
      OIDC_ROLE_ARN : arn:aws:iam::${{ secrets.AWS_DEV_ACCOUNT }}:role/oidc-${{ vars.REPO_ORG_ABBR }}-${{ vars.REPO_BACKEND }}
      ECR_REGISTRY: ${{ secrets.AWS_PROD_ACCOUNT }}
      ECR_REPO_BASE: ${{ secrets.CENTRAL_ECR_REPO_BASE }}
      ECR_REPO_PUBLISH: ${{ secrets.CENTRAL_ECR_REPO_PUBLISH }}
  # todo call cd-pipeline
  
